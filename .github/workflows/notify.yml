name: mal-notify

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mal-notify
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python mal_notify.py
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      - run: python manga_notify.py
        continue-on-error: true   # un souci manga ne doit jamais bloquer les animes
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_MANGA_URL: ${{ secrets.WEBHOOK_MANGA_URL }}
      - name: Sauvegarder l'état
        run: |
          git config user.name  "mal-notify-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state*.json
          if git diff --cached --quiet; then
            echo "rien à sauvegarder"
          else
            git commit -m "state update"
            git push origin HEAD:${{ github.ref_name }}
          fi
