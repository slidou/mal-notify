name: mal-notify

on:
  schedule:
    - cron: "*/5 * * * *"     # toutes les 5 min (retards de 5-15 min possibles)
  workflow_dispatch:          # permet de lancer à la main

permissions:
  contents: write             # autorise le commit du fichier d'état

concurrency:
  group: mal-notify
  cancel-in-progress: true    # évite deux runs simultanés

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python mal_notify.py
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      - name: Sauvegarder l'état
        run: |
          git config user.name  "mal-notify-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "rien à sauvegarder"
          else
            git commit -m "state update"
            git push origin HEAD:${{ github.ref_name }}
          fi
